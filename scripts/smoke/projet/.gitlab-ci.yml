# Pipeline du projet de test de make smoke (scripts/smoke.sh), poussé tel quel dans GitLab.
# Un job simple (runner, image par défaut, clone), un contrôle de l'isolation réseau des jobs et une
# analyse SonarQube avec les variables CI d'instance SONAR_HOST_URL et SONAR_TOKEN posées par
# make bootstrap (docs/smoke-test.md).
stages:
  - test

simple:
  stage: test
  script:
    - echo "Runner opérationnel sur $(uname -m) (pipeline $CI_PIPELINE_ID, commit $CI_COMMIT_SHORT_SHA)"
    - test -f src/exemple.py

isolation-reseau:
  stage: test
  script:
    # Contrôle positif, avec le même outil : Traefik joignable par l'URL de clone (sans afficher le
    # jeton qu'elle contient). Sans lui, un nc inutilisable ferait passer les contrôles ci-dessous.
    - |
      cible="${CI_REPOSITORY_URL#*://}"; cible="${cible#*@}"; cible="${cible%%/*}"
      case "$cible" in
        *:*) hote="${cible%:*}"; port="${cible##*:}" ;;
        *) hote="$cible"; case "$CI_REPOSITORY_URL" in https:*) port=443 ;; *) port=80 ;; esac ;;
      esac
      nc -z -w 5 "$hote" "$port" || { echo "Contrôle positif en échec : $hote:$port (Traefik) injoignable par nc"; exit 1; }
      echo "Traefik joignable : $hote:$port"
    # Services de la plateforme injoignables, par nom et par IP : isolation-cibles.txt (« service port
    # ip… »), généré par make smoke avec les IP courantes
    - |
      test -s isolation-cibles.txt || { echo "isolation-cibles.txt absent ou vide"; exit 1; }
      echec=0
      while read -r service port ips; do
        for cible in $service $ips; do
          if nc -z -w 3 "$cible" "$port" 2> /dev/null; then
            echo "JOIGNABLE : $cible:$port ($service)"; echec=1
          else
            echo "Injoignable : $cible:$port ($service)"
          fi
        done
      done < isolation-cibles.txt
      test "$echec" = 0 || { echo "Isolation réseau des jobs en défaut (docs/gitlab-proxy.md)"; exit 1; }

sonar-scanner:
  stage: test
  image:
    # Même version que l'exemple de docs/analyse-sonarqube.md
    name: sonarsource/sonar-scanner-cli:12.2.0.4256_8.1.0
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  script:
    # Clé attendue par scripts/smoke.sh (SONAR_CLE) ; branche main explicite, vérifiée par le smoke test
    - sonar-scanner -Dsonar.projectKey=devops-platform-smoke -Dsonar.sources=src -Dsonar.branch.name=main
