# =============================================================================
# Overlay de la brique SonarQube pour TLS_MODE=letsencrypt : rien à ajouter
# Fusionné avec compose/sonarqube.yml par l'include de compose.yml (compose/tls/sonarqube/${TLS_MODE}.yml) ;
# ne se lance pas seul.
# =============================================================================
# Garde-fou : PLATFORM_GARDE_FOU n'est défini que par l'include de compose.yml
x-garde-fou-tls-sonarqube-letsencrypt: "${PLATFORM_GARDE_FOU:?compose/tls/sonarqube/letsencrypt.yml est un overlay de la brique SonarQube de compose.yml et ne se lance pas seul : make deploy ENV=<env>, ou docker compose --env-file envs/<env>.env … depuis la racine du repo, sans -f ni -p}"

services:
  sonarqube: {}
