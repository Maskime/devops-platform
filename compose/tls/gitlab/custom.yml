# =============================================================================
# Overlay de la brique GitLab pour TLS_MODE=custom : CA privée facultative (config/certs/ca/ca.pem)
# montée dans gitlab-runner, qui l'utilise pour s'enregistrer et joindre GitLab, et la transmet aux
# jobs (CI_SERVER_TLS_CA_FILE). Utilisée par make bootstrap (tls-ca-file) : docs/certificats.md.
# Fusionné avec compose/gitlab.yml par l'include de compose.yml (compose/tls/gitlab/${TLS_MODE}.yml) ;
# ne se lance pas seul. Chemins relatifs résolus depuis compose/ (premier fichier de l'include) ;
# ${PLATFORM_CA_DIR} les remplace en déploiement distant : copie propre à la CA, d'empreinte distincte
# de celle de config/ (docs/deploiement.md). Un changement de CA est appliqué par make reload-certs et
# make deploy (scripts/instance.sh), avec arrêt gracieux du runner (compose/gitlab.yml).
# =============================================================================
# Garde-fou : PLATFORM_GARDE_FOU n'est défini que par l'include de compose.yml
x-garde-fou-tls-gitlab-custom: "${PLATFORM_GARDE_FOU:?compose/tls/gitlab/custom.yml est un overlay de la brique GitLab de compose.yml et ne se lance pas seul : make deploy ENV=<env>, ou docker compose --env-file envs/<env>.env … depuis la racine du repo, sans -f ni -p}"

services:
  gitlab-runner:
    # Répertoire monté (et non le fichier) : la CA reste facultative. Jamais config/certs/ entier
    # (key.pem). Cible hors du volume /etc/gitlab-runner ; chemin repris par CA_CONTENEUR
    # (scripts/bootstrap/gitlab.sh) : à garder identiques.
    volumes:
      - type: bind
        source: ${PLATFORM_CA_DIR:-../config/certs/ca}
        target: /etc/devops-platform/ca
        read_only: true
        bind:
          create_host_path: false
