# =============================================================================
# Brique GitLab : forge, tickets et CI/CD
# Inclus par compose.yml ; ne se lance pas seul (voir l'en-tête de compose.yml).
# =============================================================================
services:

  # ---------------------------------------------------------------------------
  # GitLab CE — forge, tickets, CI/CD
  # ---------------------------------------------------------------------------
  gitlab:
    image: gitlab/gitlab-ce:${GITLAB_VERSION:-19.4.1-ce.0}
    restart: always
    hostname: gitlab
    # Profil de dimensionnement (PLATFORM_PROFILE) : variables PROFILE_GITLAB_* lues ci-dessous
    env_file:
      - ../config/profiles/${PLATFORM_PROFILE:-medium}.env
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url '${GITLAB_EXTERNAL_URL:?GITLAB_EXTERNAL_URL obligatoire (voir envs/.env.example)}'
        gitlab_rails['initial_root_password'] = '${GITLAB_ROOT_PASSWORD:?GITLAB_ROOT_PASSWORD obligatoire (voir envs/.env.example)}'
        # Port SSH publié sur l'hôte, affiché dans les URLs de clone
        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT:-2222}
        # Écoute interne fixe sur 80 (HTTP), servie par Traefik sur GITLAB_HOSTNAME
        nginx['listen_port'] = 80

        # Dimensionnement : valeurs du profil (config/profiles/<profil>.env, injecté par env_file)
        puma['worker_processes'] = Integer(ENV.fetch('PROFILE_GITLAB_PUMA_WORKERS'))
        puma['min_threads'] = Integer(ENV.fetch('PROFILE_GITLAB_PUMA_MIN_THREADS'))
        puma['max_threads'] = Integer(ENV.fetch('PROFILE_GITLAB_PUMA_MAX_THREADS'))
        sidekiq['concurrency'] = Integer(ENV.fetch('PROFILE_GITLAB_SIDEKIQ_CONCURRENCY'))
        postgresql['shared_buffers'] = ENV.fetch('PROFILE_GITLAB_PG_SHARED_BUFFERS')
        postgresql['max_connections'] = Integer(ENV.fetch('PROFILE_GITLAB_PG_MAX_CONNECTIONS'))

        # Désactive les services de monitoring intégrés
        prometheus_monitoring['enable'] = false
        alertmanager['enable'] = false
    # Seul le SSH est publié : l'interface web passe par Traefik (compose/proxy.yml)
    ports:
      - "${GITLAB_SSH_PORT:-2222}:22"
    labels:
      traefik.enable: "true"
      traefik.http.routers.gitlab.rule: Host(`${GITLAB_HOSTNAME:-gitlab.localhost}`)
      traefik.http.routers.gitlab.entrypoints: web
      traefik.http.services.gitlab.loadbalancer.server.port: "80"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/-/health"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    networks:
      - platform

  # ---------------------------------------------------------------------------
  # GitLab Runner — exécuteur CI/CD
  # ---------------------------------------------------------------------------
  gitlab-runner:
    image: gitlab/gitlab-runner:${GITLAB_RUNNER_VERSION:-v19.4.1}
    restart: always
    environment:
      # Serveur de métriques interne (sans publication de port) : sert de sonde de santé
      LISTEN_ADDRESS: ":9252"
    volumes:
      - gitlab_runner_config:/etc/gitlab-runner
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-sf", "-o", "/dev/null", "http://localhost:9252/metrics"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - platform
    depends_on:
      gitlab:
        condition: service_healthy

# Définition strictement identique dans chaque module (compose refuse les définitions divergentes)
networks:
  platform:
    name: ${PLATFORM_NETWORK:-devops-platform}
    driver: bridge

# Noms explicites (= noms qu'attribuait Compose : données existantes conservées). Le préfixe reprend
# le nom de projet : le changer impose de modifier aussi `name:` dans compose.yml, le filtre de
# config/promtail/promtail-config.yaml et la contrainte du provider Docker de compose/proxy.yml.
volumes:
  gitlab_config:
    name: devops-platform_gitlab_config
  gitlab_logs:
    name: devops-platform_gitlab_logs
  gitlab_data:
    name: devops-platform_gitlab_data
  gitlab_runner_config:
    name: devops-platform_gitlab_runner_config
