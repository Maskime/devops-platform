# =============================================================================
# Brique proxy : point d'entrée HTTP unique de la plateforme
# Inclus par compose.yml ; lancé seul, il est refusé par le garde-fou ci-dessous (voir l'en-tête
# de compose.yml).
# =============================================================================
# Garde-fou : PLATFORM_GARDE_FOU n'est défini que par l'include de compose.yml
x-garde-fou-proxy: "${PLATFORM_GARDE_FOU:?compose/proxy.yml est un module de compose.yml et ne se lance pas seul (conteneurs en double sur les volumes de l'instance) : make deploy ENV=<env>, ou docker compose --env-file envs/<env>.env … depuis la racine du repo, sans -f ni -p}"

services:

  # ---------------------------------------------------------------------------
  # Traefik — reverse proxy, routage par hostname (*_HOSTNAME de l'instance)
  # Seul service web à publier un port sur l'hôte. Les services exposés le déclarent par leurs
  # labels traefik.* (traefik.enable=true, règle Host(`<hostname>`), port interne).
  # Configuration statique par variables TRAEFIK_* (et non par `command:`) : Traefik n'accepte qu'une
  # source (fichier, arguments ou variables) et l'overlay du mode TLS (compose/tls/<mode>.yml, fusionné
  # par l'include de compose.yml) complète `environment`, `ports` et `volumes` ; `command` serait
  # remplacé en entier. Entrypoint web (:80, HTTP) commun à tous les modes.
  # Routeurs publics : aucun label `entrypoints` ; ils suivent l'entrypoint par défaut (`web` en none,
  # `websecure` en HTTPS, marqué asDefault par l'overlay du mode TLS). Seuls les routeurs internes des
  # jobs CI (gitlab-interne, sonarqube-interne) déclarent `entrypoints: interne`.
  # Alias réseau : les hostnames publics désignent Traefik dans le réseau de la plateforme (runner), dans
  # le réseau des jobs CI et dans celui des projets co-localisés ; le runner, les jobs et ces projets
  # dépendent donc de Traefik pour joindre GitLab.
  # Réseaux des jobs et des consommateurs : seul Traefik y est rattaché ; un job ou un projet co-localisé
  # ne joint aucun autre service de la plateforme (bases, Loki, nginx de GitLab), et Docker bloque le
  # trafic entre ces deux réseaux : docs/gitlab-proxy.md, « Runner et jobs CI ».
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:${TRAEFIK_VERSION:-v3.7.13}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      TRAEFIK_ENTRYPOINTS_WEB_ADDRESS: ":80"
      # Supprime les en-têtes alias (X_Forwarded_For…) : nginx (GitLab) les lirait comme les en-têtes
      # posés par Traefik, ce qui permettrait à un client de les usurper
      TRAEFIK_ENTRYPOINTS_WEB_HTTP_ALIASHEADERSSTRATEGY: delete
      # Entrypoint interne des jobs CI (HTTP, non publié, sans redirection quel que soit le TLS_MODE) :
      # noms *.devops-platform.internal, quand l'URL publique est inutilisable depuis un job (hostname
      # *.localhost, CA privée inconnue du scanner SonarQube). Port repris par scripts/bootstrap/gitlab.sh
      # (URL_INTERNE_*) : à garder identiques.
      TRAEFIK_ENTRYPOINTS_INTERNE_ADDRESS: ":8000"
      TRAEFIK_ENTRYPOINTS_INTERNE_HTTP_ALIASHEADERSSTRATEGY: delete
      # API Docker lue via son proxy de socket filtrant (compose/socket-proxy.yml) : Traefik ne monte
      # pas le socket, une compromission ne donne pas la main sur l'hôte (ni accès aux logs)
      TRAEFIK_PROVIDERS_DOCKER_ENDPOINT: tcp://socket-proxy-traefik:2375
      # Seuls les conteneurs marqués traefik.enable=true sont exposés
      TRAEFIK_PROVIDERS_DOCKER_EXPOSEDBYDEFAULT: "false"
      # Réseau par lequel joindre les services (requis dès qu'un conteneur en a plusieurs)
      TRAEFIK_PROVIDERS_DOCKER_NETWORK: ${PLATFORM_NETWORK:-devops-platform}
      # Ignore les conteneurs hors projet (jobs CI, conteneurs tiers). Nom de projet en dur :
      # le changer impose de modifier aussi `name:` dans compose.yml et compose/projet-autorise/.
      TRAEFIK_PROVIDERS_DOCKER_CONSTRAINTS: Label(`com.docker.compose.project`,`devops-platform`)
      # Sonde de santé sur l'entrypoint interne par défaut `traefik` (:8080, non publié) : ne pas
      # redéfinir cet entrypoint, `traefik healthcheck` suppose sa valeur par défaut.
      # Aucune variable TRAEFIK_API* : l'API et le dashboard restent désactivés.
      TRAEFIK_PING: "true"
      # Logs d'accès sur la sortie standard, collectés par promtail
      TRAEFIK_ACCESSLOG: "true"
      TRAEFIK_LOG_LEVEL: INFO
      TRAEFIK_GLOBAL_CHECKNEWVERSION: "false"
      TRAEFIK_GLOBAL_SENDANONYMOUSUSAGE: "false"
    ports:
      - "80:80"
    depends_on:
      socket-proxy-traefik:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      # platform, ci et consumers : réseaux à passerelle (socket-proxy-traefik, gitlab-proxy et grafana-proxy sont internes), porteurs des
      # ports publiés et de l'accès sortant (ACME). Pas de gw_priority : il exigerait Compose 2.33 /
      # Engine 28, au-delà des versions minimales de scripts/host-prereqs.sh (#145).
      platform:
        # Hostnames publics résolus vers Traefik dans le réseau de la plateforme : le runner et les
        # services joignent les URLs publiques par le même chemin (et le même certificat) que les
        # clients externes, sans dépendre du DNS ni du hairpin NAT de l'hôte. Défauts identiques aux
        # labels traefik.http.routers.<service>.rule des modules.
        aliases:
          - ${GITLAB_HOSTNAME:-gitlab.localhost}
          - ${SONARQUBE_HOSTNAME:-sonarqube.localhost}
          - ${GRAFANA_HOSTNAME:-grafana.localhost}
          - ${PORTAINER_HOSTNAME:-portainer.localhost}
          - ${PLANTUML_HOSTNAME:-plantuml.localhost}
      # Réseau des jobs CI : mêmes hostnames publics, plus les noms internes servis par l'entrypoint
      # `interne` (labels traefik.http.routers.<service>-interne.rule des modules, URL_INTERNE_* de
      # scripts/bootstrap/gitlab.sh : à garder identiques)
      ci:
        aliases: &alias-clients
          - ${GITLAB_HOSTNAME:-gitlab.localhost}
          - ${SONARQUBE_HOSTNAME:-sonarqube.localhost}
          - ${GRAFANA_HOSTNAME:-grafana.localhost}
          - ${PORTAINER_HOSTNAME:-portainer.localhost}
          - ${PLANTUML_HOSTNAME:-plantuml.localhost}
          - gitlab.devops-platform.internal
          - sonarqube.devops-platform.internal
      # Réseau des projets co-localisés : mêmes alias que le réseau des jobs (ancre)
      consumers:
        aliases: *alias-clients
      # Lien vers le nginx de GitLab, seul sous-réseau auquel GitLab fait confiance pour X-Forwarded-For
      gitlab-proxy: {}
      # Lien vers Grafana : seule adresse source dont Grafana accepte l'identité (auth.proxy)
      grafana-proxy:
        ipv4_address: ${GRAFANA_PROXY_IP_TRAEFIK:-172.31.254.30}
      # Accès à l'API Docker filtrée (compose/socket-proxy.yml), réseau partagé avec son seul proxy
      socket-proxy-traefik: {}

  # ---------------------------------------------------------------------------
  # Passerelle d'authentification (oauth2-proxy, fournisseur GitLab) : forward auth de Traefik devant
  # les routeurs publics home, plantuml, grafana, sonarqube et portainer (middleware passerelle-auth,
  # déclaré ci-dessous et référencé par les labels de ces services). Mécanisme, exemptions et limites :
  # docs/sso.md.
  # Lanceur config/oauth2-proxy/lanceur.sh : sonde de l'application OAuth GitLab (créée par make
  # bootstrap), puis mode actif, ou mode refus avec une page explicite (redémarrage périodique pour
  # rejouer la sonde). Passerelle arrêtée ou non healthy : Traefik retire son middleware et les
  # routeurs protégés ne sont plus servis (404) ; aucun accès sans authentification.
  # Image -alpine : sh et wget (lanceur, healthcheck), absents de l'image distroless.
  # ---------------------------------------------------------------------------
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:${OAUTH2_PROXY_VERSION:-v7.15.5-alpine}
    restart: unless-stopped
    # Pas de read_only : Compose copie les secrets de source `environment` dans le conteneur
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/bin/sh", "/etc/devops-platform/oauth2-proxy/lanceur.sh"]
    # Secret client et secret de cookie : lus dans les fichiers par oauth2-proxy (*-file), jamais
    # interpolés ici (absents de `docker compose config`) ; présence et format contrôlés par make check-env
    secrets:
      - sso_client_secret
      - sso_cookie_secret
    environment:
      SSO_CLIENT_ID: ${SSO_GITLAB_CLIENT_ID:-}
      SSO_GITLAB_GROUPE: ${SSO_GITLAB_GROUPE:-}
      SSO_TLS_MODE: ${TLS_MODE:-none}
      # URL publique de GitLab (fournisseur) : GITLAB_EXTERNAL_URL, sinon dérivée du hostname et du
      # TLS_MODE par le lanceur (même règle que compose/gitlab.yml)
      SSO_GITLAB_URL: ${GITLAB_EXTERNAL_URL:-}
      SSO_GITLAB_HOSTNAME: ${GITLAB_HOSTNAME:-gitlab.localhost}
      # Hostnames protégés (destinations de retour admises) : défauts identiques aux labels
      # traefik.http.routers.<service>.rule des modules et au routeur passerelle ci-dessous
      SSO_HOSTNAMES: >-
        ${HOME_HOSTNAME:-home.localhost} ${PLANTUML_HOSTNAME:-plantuml.localhost}
        ${GRAFANA_HOSTNAME:-grafana.localhost} ${SONARQUBE_HOSTNAME:-sonarqube.localhost}
        ${PORTAINER_HOSTNAME:-portainer.localhost}
    labels:
      traefik.enable: "true"
      # Chemin /oauth2/ (callback, déconnexion) de chaque hostname protégé servi par la passerelle :
      # cookie de session par hostname, aucun domaine parent commun exigé
      traefik.http.routers.passerelle.rule: >-
        (Host(`${HOME_HOSTNAME:-home.localhost}`) || Host(`${PLANTUML_HOSTNAME:-plantuml.localhost}`)
        || Host(`${GRAFANA_HOSTNAME:-grafana.localhost}`) || Host(`${SONARQUBE_HOSTNAME:-sonarqube.localhost}`)
        || Host(`${PORTAINER_HOSTNAME:-portainer.localhost}`)) && PathPrefix(`/oauth2/`)
      traefik.http.routers.passerelle.priority: "1000"
      traefik.http.routers.passerelle.middlewares: passerelle-sans-identite
      traefik.http.services.passerelle.loadbalancer.server.port: "4180"
      # Forward auth : sans session, redirection vers GitLab (puis retour sur l'URL demandée) ; avec
      # session, en-têtes d'identité X-Auth-Request-* (login, e-mail, groupes) copiés sur la requête
      # transmise. Traefik retire d'abord de la requête tout en-tête correspondant au motif : un en-tête
      # forgé par le client ne passe jamais.
      traefik.http.middlewares.passerelle-auth.forwardauth.address: http://oauth2-proxy:4180/
      traefik.http.middlewares.passerelle-auth.forwardauth.authResponseHeadersRegex: ^X-Auth-Request-
      # En-têtes d'identité reçus du client supprimés (même liste sur chaque routeur exempté :
      # <service>-sans-identite dans les modules)
      traefik.http.middlewares.passerelle-sans-identite.headers.customrequestheaders.X-Auth-Request-User: ""
      traefik.http.middlewares.passerelle-sans-identite.headers.customrequestheaders.X-Auth-Request-Email: ""
      traefik.http.middlewares.passerelle-sans-identite.headers.customrequestheaders.X-Auth-Request-Groups: ""
      traefik.http.middlewares.passerelle-sans-identite.headers.customrequestheaders.X-Auth-Request-Preferred-Username: ""
      traefik.http.middlewares.passerelle-sans-identite.headers.customrequestheaders.X-Auth-Request-Access-Token: ""
      traefik.http.middlewares.passerelle-sans-identite.headers.customrequestheaders.X-Auth-Request-Redirect: ""
      traefik.http.middlewares.passerelle-sans-identite.headers.customrequestheaders.X-Auth-Request-Role: ""
    volumes:
      - type: bind
        source: ${PLATFORM_CONFIG_DIR:-../config}/oauth2-proxy
        target: /etc/devops-platform/oauth2-proxy
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4180/ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    # platform : URL publique de GitLab via l'alias de Traefik, sonde interne http://gitlab, requêtes
    # de Traefik
    networks:
      - platform

# Secret client de l'application OAuth GitLab et secret de chiffrement des cookies de la passerelle, lus
# dans les variables de envs/<env>.env et montés en fichiers dans /run/secrets
secrets:
  sso_client_secret:
    environment: SSO_GITLAB_CLIENT_SECRET
  sso_cookie_secret:
    environment: SSO_COOKIE_SECRET

# Définition strictement identique dans chaque module (compose refuse les définitions divergentes)
networks:
  platform:
    name: ${PLATFORM_NETWORK:-devops-platform}
    driver: bridge
  socket-proxy-traefik:
    name: devops-platform_socket-proxy-traefik
    driver: bridge
    internal: true
  # Réseau des conteneurs de jobs CI (GITLAB_RUNNER_NETWORK, enregistré par make bootstrap), créé ici
  # car Traefik est son seul membre permanent. Non interne : accès sortant des jobs.
  ci:
    name: ${GITLAB_RUNNER_NETWORK:-devops-platform_ci}
    driver: bridge
  # Réseau des projets co-localisés (CONSUMER_NETWORK, exporté par make bootstrap dans
  # outputs/<env>.env), distinct du réseau des jobs : un job ne joint pas leurs conteneurs, ni eux un job.
  # Créé ici car Traefik est son seul membre côté plateforme. Non interne, comme ci.
  consumers:
    name: ${CONSUMER_NETWORK:-devops-platform_consumers}
    driver: bridge
  # Lien Traefik → GitLab, sous-réseau fixé (confiance X-Forwarded-For de compose/gitlab.yml).
  # Définition strictement identique dans compose/gitlab.yml.
  gitlab-proxy:
    name: devops-platform_gitlab-proxy
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${GITLAB_PROXY_SUBNET:-172.31.254.0/28}
  # Lien Traefik → Grafana, sous-réseau fixé, adresse de Traefik fixée (confiance auth.proxy de
  # compose/observability.yml). Définition strictement identique dans compose/observability.yml.
  grafana-proxy:
    name: devops-platform_grafana-proxy
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${GRAFANA_PROXY_SUBNET:-172.31.254.16/28}
