# =============================================================================
# Brique outils : gestion des conteneurs et génération de diagrammes
# Inclus par compose.yml ; lancé seul, il est refusé par le garde-fou ci-dessous (voir l'en-tête
# de compose.yml).
# =============================================================================
# Garde-fou : PLATFORM_GARDE_FOU n'est défini que par l'include de compose.yml
x-garde-fou-tools: "${PLATFORM_GARDE_FOU:?compose/tools.yml est un module de compose.yml et ne se lance pas seul (conteneurs en double sur les volumes de l'instance) : make deploy ENV=<env>, ou docker compose --env-file envs/<env>.env … depuis la racine du repo, sans -f ni -p}"

services:

  # ---------------------------------------------------------------------------
  # Portainer CE — gestion des conteneurs (UI web)
  # UI : http://${PORTAINER_HOSTNAME}, servie par Traefik (HTTP interne 9000 ; 9443 non utilisé)
  # Aucun port publié : le tunnel des agents Edge (8000) n'est pas proposé (surface d'exposition).
  # Variante -alpine (même version) : l'image standard ne contient aucun shell ni client HTTP,
  # ce qui interdit tout healthcheck.
  # ---------------------------------------------------------------------------
  portainer:
    image: portainer/portainer-ce:${PORTAINER_VERSION:-2.45.1-alpine}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Compte admin créé dès le premier démarrage : sans lui, le premier visiteur de l'UI le créerait.
    # Fichier en texte clair (≥ 12 caractères, contrôlé par make check-env) ; ne pas combiner avec
    # --admin-password. Ignoré si un administrateur existe déjà (volume portainer_data initialisé).
    command: --admin-password-file=/run/secrets/portainer_admin_password
    secrets:
      - portainer_admin_password
    labels:
      traefik.enable: "true"
      traefik.http.routers.portainer.rule: Host(`${PORTAINER_HOSTNAME:-portainer.localhost}`)
      traefik.http.routers.portainer.entrypoints: web
      traefik.http.services.portainer.loadbalancer.server.port: "9000"
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - portainer_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9000/api/system/status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - platform

  # ---------------------------------------------------------------------------
  # PlantUML Server — génération de diagrammes PNG/SVG via HTTP
  # URL : http://${PLANTUML_HOSTNAME}, servie par Traefik
  # API : GET /png/<encoded> ou GET /svg/<encoded>
  # Interne : http://plantuml:8080
  # ---------------------------------------------------------------------------
  plantuml:
    image: plantuml/plantuml-server:${PLANTUML_VERSION:-jetty-v1.2026.8}
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.http.routers.plantuml.rule: Host(`${PLANTUML_HOSTNAME:-plantuml.localhost}`)
      traefik.http.routers.plantuml.entrypoints: web
      traefik.http.services.plantuml.loadbalancer.server.port: "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - platform

# Mot de passe admin lu dans la variable PORTAINER_ADMIN_PASSWORD (envs/<env>.env), monté en fichier
# dans /run/secrets : jamais interpolé ici, donc absent de `docker compose config` et de `docker inspect`.
# Présence et longueur contrôlées par make check-env (un ${…:?} afficherait la valeur dans `config`).
secrets:
  portainer_admin_password:
    environment: PORTAINER_ADMIN_PASSWORD

# Définition strictement identique dans chaque module (compose refuse les définitions divergentes)
networks:
  platform:
    name: ${PLATFORM_NETWORK:-devops-platform}
    driver: bridge

# Noms explicites (= noms qu'attribuait Compose : données existantes conservées). Le préfixe reprend
# le nom de projet : le changer impose de modifier aussi `name:` dans compose.yml, le filtre de
# config/promtail/promtail-config.yaml, le nom du fichier compose/projet-autorise/<projet>.env et
# la contrainte du provider Docker de compose/proxy.yml.
volumes:
  portainer_data:
    name: devops-platform_portainer_data
