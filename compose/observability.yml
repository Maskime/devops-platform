# =============================================================================
# Brique observabilité : centralisation et consultation des logs
# Inclus par compose.yml ; ne se lance pas seul (voir l'en-tête de compose.yml).
# Les chemins relatifs sont résolus depuis ce dossier (compose/).
# =============================================================================
services:

  # ---------------------------------------------------------------------------
  # Loki — agrégateur de logs
  # Interne uniquement — accessible sur le réseau de la plateforme via loki:3100
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:${LOKI_VERSION:-3.7.8}
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ../config/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    expose:
      - "3100"
    # Pas de healthcheck : l'image est distroless depuis Loki 3.6 (ni shell, ni wget, ni curl).
    # Disponibilité vérifiable via GET http://loki:3100/ready depuis le réseau.
    networks:
      - platform

  # ---------------------------------------------------------------------------
  # Promtail — collecteur de logs Docker → Loki
  # Déprécié par Grafana (3.6.x = dernière version) : migration vers Alloy suivie dans #35
  # ---------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:${PROMTAIL_VERSION:-3.6.11}
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ../config/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - promtail_positions:/var/promtail
    # Sonde /ready de promtail ET de loki : l'image loki est distroless (ni shell ni client HTTP),
    # promtail sert donc de témoin de santé de loki. Image sans curl ni wget : requête via /dev/tcp.
    # promtail /ready ne répond 200 qu'une fois une cible découverte (lui-même au minimum).
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          for cible in 127.0.0.1:9080 loki:3100; do
          exec 3<>"/dev/tcp/$${cible%:*}/$${cible#*:}" &&
          printf 'GET /ready HTTP/1.0\r\nHost: %s\r\n\r\n' "$$cible" >&3 &&
          head -n1 <&3 | grep -q ' 200' || exit 1;
          exec 3>&-;
          done
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      loki:
        condition: service_started
    networks:
      - platform

  # ---------------------------------------------------------------------------
  # Grafana — UI de visualisation des logs
  # Image grafana/grafana : grafana/grafana-oss n'est plus publiée depuis la 13.0.2
  # URL : ${GRAFANA_EXTERNAL_URL} (défaut : http://localhost:${GRAFANA_PORT})
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.2.3}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD obligatoire (voir envs/.env.example)}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_HTTP_PORT: "3000"
      GF_SERVER_ROOT_URL: ${GRAFANA_EXTERNAL_URL:-http://localhost:${GRAFANA_PORT:-3100}}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    ports:
      - "${GRAFANA_PORT:-3100}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../config/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - platform

# Définition strictement identique dans chaque module (compose refuse les définitions divergentes)
networks:
  platform:
    name: ${PLATFORM_NETWORK:-devops-platform}
    driver: bridge

# Noms explicites (= noms qu'attribuait Compose : données existantes conservées). Le préfixe reprend
# le nom de projet : le changer impose de modifier aussi `name:` dans compose.yml et le filtre de
# config/promtail/promtail-config.yaml.
volumes:
  loki_data:
    name: devops-platform_loki_data
  promtail_positions:
    name: devops-platform_promtail_positions
  grafana_data:
    name: devops-platform_grafana_data
