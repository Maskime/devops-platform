# =============================================================================
# Brique observabilité : centralisation et consultation des logs
# Inclus par compose.yml ; lancé seul, il est refusé par le garde-fou ci-dessous (voir l'en-tête
# de compose.yml).
# Les chemins relatifs sont résolus depuis ce dossier (compose/).
# Fichiers de config montés depuis ${PLATFORM_CONFIG_DIR:-../config} : positionnée par
# scripts/instance.sh vers la copie de config/ sur l'hôte cible en déploiement distant
# (docs/deploiement.md). Montages sans création du chemin sur l'hôte : une source absente fait
# échouer `up` au lieu que Docker crée un répertoire vide.
# =============================================================================
# Garde-fou : PLATFORM_GARDE_FOU n'est défini que par l'include de compose.yml
x-garde-fou-observability: "${PLATFORM_GARDE_FOU:?compose/observability.yml est un module de compose.yml et ne se lance pas seul (conteneurs en double sur les volumes de l'instance) : make deploy ENV=<env>, ou docker compose --env-file envs/<env>.env … depuis la racine du repo, sans -f ni -p}"

services:

  # ---------------------------------------------------------------------------
  # Loki — agrégateur de logs
  # Interne uniquement — accessible sur le réseau de la plateforme via loki:3100
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:${LOKI_VERSION:-3.7.8}
    restart: unless-stopped
    # expand-env : loki-config.yaml lit LOKI_RETENTION_PERIOD (défaut 744h défini dans ce fichier,
    # appliqué aussi quand la variable est vide)
    command: -config.file=/etc/loki/loki-config.yaml -config.expand-env=true
    environment:
      LOKI_RETENTION_PERIOD: ${LOKI_RETENTION_PERIOD:-}
    volumes:
      - type: bind
        source: ${PLATFORM_CONFIG_DIR:-../config}/loki/loki-config.yaml
        target: /etc/loki/loki-config.yaml
        read_only: true
        bind:
          create_host_path: false
      - loki_data:/loki
    expose:
      - "3100"
    # Pas de healthcheck : l'image est distroless depuis Loki 3.6 (ni shell, ni wget, ni curl).
    # Disponibilité vérifiable via GET http://loki:3100/ready depuis le réseau.
    networks:
      - platform

  # ---------------------------------------------------------------------------
  # Promtail — collecteur de logs Docker → Loki, sans montage du socket Docker (proxy filtrant)
  # Déprécié par Grafana (3.6.x = dernière version) : migration vers Alloy suivie dans #35
  # ---------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:${PROMTAIL_VERSION:-3.6.11}
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - type: bind
        source: ${PLATFORM_CONFIG_DIR:-../config}/promtail/promtail-config.yaml
        target: /etc/promtail/promtail-config.yaml
        read_only: true
        bind:
          create_host_path: false
      - promtail_positions:/var/promtail
    # Sonde /ready de promtail ET de loki : l'image loki est distroless (ni shell ni client HTTP),
    # promtail sert donc de témoin de santé de loki. Image sans curl ni wget : requête via /dev/tcp.
    # promtail /ready ne répond 200 qu'une fois une cible découverte (lui-même au minimum).
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          for cible in 127.0.0.1:9080 loki:3100; do
          exec 3<>"/dev/tcp/$${cible%:*}/$${cible#*:}" &&
          printf 'GET /ready HTTP/1.0\r\nHost: %s\r\n\r\n' "$$cible" >&3 &&
          head -n1 <&3 | grep -q ' 200' || exit 1;
          exec 3>&-;
          done
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      loki:
        condition: service_started
      socket-proxy:
        condition: service_healthy
    networks:
      # platform : seul réseau à passerelle (socket-proxy est interne), voir compose/proxy.yml
      - platform
      # Découverte des conteneurs et lecture de leurs logs via l'API Docker filtrée
      # (compose/socket-proxy.yml, tcp://socket-proxy:2375 dans promtail-config.yaml)
      - socket-proxy

  # ---------------------------------------------------------------------------
  # Grafana — UI de visualisation des logs
  # Image grafana/grafana : grafana/grafana-oss n'est plus publiée depuis la 13.0.2
  # URL : ${GRAFANA_EXTERNAL_URL} (défaut : http://${GRAFANA_HOSTNAME}), servie par Traefik
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.2.3}
    restart: unless-stopped
    # Garde-fou : sans secret lisible et non vide, /run.sh exporterait un mot de passe vide et Grafana
    # créerait le compte admin avec le mot de passe par défaut (admin). Démarrage refusé à la place,
    # y compris lancé par `docker compose up` sans make (contrôle de make check-env contourné).
    entrypoint:
      - /bin/sh
      - -c
      - >-
        test -r /run/secrets/grafana_admin_password && test -s /run/secrets/grafana_admin_password ||
        { echo "Secret grafana_admin_password absent ou vide : définir GRAFANA_ADMIN_PASSWORD (envs/.env.example)" >&2; exit 1; };
        exec /run.sh "$$@"
      - sh
    # Mot de passe admin lu dans le fichier par /run.sh (convention __FILE de l'image), appliqué à la
    # création du compte seulement (volume grafana_data vierge). Ne pas définir aussi
    # GF_SECURITY_ADMIN_PASSWORD (surcharge locale) : /run.sh refuse de démarrer.
    secrets:
      - grafana_admin_password
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password # chemin du secret, pas une valeur (check-secrets: ignore)
      # Authentification obligatoire : ni accès anonyme, ni inscription, ni création d'organisation
      # (sign-up et org create valent déjà false par défaut : explicités pour figer la surface)
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      # Contenus consultables sans compte : dashboards partagés publiquement et snapshots (par clé),
      # snapshots externes (données envoyées hors de l'instance)
      GF_PUBLIC_DASHBOARDS_ENABLED: "false"
      GF_SNAPSHOTS_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_SERVER_HTTP_PORT: "3000"
      GF_SERVER_ROOT_URL: ${GRAFANA_EXTERNAL_URL:-http://${GRAFANA_HOSTNAME:-grafana.localhost}}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    labels:
      traefik.enable: "true"
      traefik.http.routers.grafana.rule: Host(`${GRAFANA_HOSTNAME:-grafana.localhost}`)
      traefik.http.services.grafana.loadbalancer.server.port: "3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - type: bind
        source: ${PLATFORM_CONFIG_DIR:-../config}/grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - platform

# Mot de passe admin lu dans la variable GRAFANA_ADMIN_PASSWORD (envs/<env>.env), monté en fichier
# dans /run/secrets : jamais interpolé ici, donc absent de `docker compose config` et de `docker inspect`.
# Présence contrôlée par make check-env (un ${…:?} afficherait la valeur dans `config`) et, au
# démarrage, par l'entrypoint de grafana.
secrets:
  grafana_admin_password:
    environment: GRAFANA_ADMIN_PASSWORD

# Définition strictement identique dans chaque module (compose refuse les définitions divergentes)
networks:
  platform:
    name: ${PLATFORM_NETWORK:-devops-platform}
    driver: bridge
  socket-proxy:
    name: devops-platform_socket-proxy
    driver: bridge
    internal: true

# Noms explicites (= noms qu'attribuait Compose : données existantes conservées). Le préfixe reprend
# le nom de projet : le changer impose de modifier aussi `name:` dans compose.yml, le filtre de
# config/promtail/promtail-config.yaml, le nom du fichier compose/projet-autorise/<projet>.env et
# la contrainte du provider Docker de compose/proxy.yml.
volumes:
  loki_data:
    name: devops-platform_loki_data
  promtail_positions:
    name: devops-platform_promtail_positions
  grafana_data:
    name: devops-platform_grafana_data
