# =============================================================================
# Brique observabilité : centralisation et consultation des logs
# Inclus par compose.yml ; ne se lance pas seul (voir l'en-tête de compose.yml).
# Les chemins relatifs sont résolus depuis ce dossier (compose/).
# =============================================================================
services:

  # ---------------------------------------------------------------------------
  # Loki — agrégateur de logs
  # Interne uniquement — accessible sur factory-network via loki:3100
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.4.2
    container_name: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ../config/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    expose:
      - "3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - factory-network

  # ---------------------------------------------------------------------------
  # Promtail — collecteur de logs Docker → Loki
  # ---------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:3.4.2
    container_name: promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ../config/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/var/promtail
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - factory-network

  # ---------------------------------------------------------------------------
  # Grafana — UI de visualisation des logs
  # URL : http://localhost:${GRAFANA_PORT:-3100}
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana-oss:11.6.1
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_HTTP_PORT: "3000"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    ports:
      - "${GRAFANA_PORT:-3100}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../config/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - factory-network

# Définition strictement identique dans chaque module (compose refuse les définitions divergentes)
networks:
  factory-network:
    name: factory-network
    driver: bridge

volumes:
  loki_data:
  promtail_positions:
  grafana_data:
