# =============================================================================
# Brique SonarQube : analyse statique
# Inclus par compose.yml ; lancé seul, il est refusé par le garde-fou ci-dessous (voir l'en-tête
# de compose.yml).
# =============================================================================
# Garde-fou : PLATFORM_GARDE_FOU n'est défini que par l'include de compose.yml
x-garde-fou-sonarqube: "${PLATFORM_GARDE_FOU:?compose/sonarqube.yml est un module de compose.yml et ne se lance pas seul (conteneurs en double sur les volumes de l'instance) : make deploy ENV=<env>, ou docker compose --env-file envs/<env>.env … depuis la racine du repo, sans -f ni -p}"

services:

  # ---------------------------------------------------------------------------
  # SonarQube DB — PostgreSQL 17 (SonarQube 26.5 supporte 15 à 17 ; 18 à partir de 26.8)
  # ---------------------------------------------------------------------------
  sonarqube-db:
    image: postgres:${SONARQUBE_DB_VERSION:-17.11}
    restart: always
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONARQUBE_DB_PASSWORD:?SONARQUBE_DB_PASSWORD obligatoire (voir envs/.env.example)}
      POSTGRES_DB: sonar
    volumes:
      - sonarqube_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - platform

  # ---------------------------------------------------------------------------
  # SonarQube Community Edition + plugin community branch
  # Version bornée par le plugin (26.5 = dernière supportée, SonarQube 26.9 publié)
  # Prérequis hôte : sysctl -w vm.max_map_count=524288 (Elasticsearch intégré)
  # ---------------------------------------------------------------------------
  sonarqube:
    image: mc1arke/sonarqube-with-community-branch-plugin:${SONARQUBE_VERSION:-26.5.0.122743-community}
    restart: always
    depends_on:
      sonarqube-db:
        condition: service_healthy
    # Profil de dimensionnement (PLATFORM_PROFILE) : heaps JVM SONAR_{WEB,CE,SEARCH}_JAVAOPTS
    env_file:
      - ../config/profiles/${PLATFORM_PROFILE:-medium}.env
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONARQUBE_DB_PASSWORD:?SONARQUBE_DB_PASSWORD obligatoire (voir envs/.env.example)}
    # URL publique (liens des notifications, décoration des merge requests). Passée en option -D :
    # la variable d'environnement SONAR_CORE_SERVERBASEURL serait lue en minuscules
    # (sonar.core.serverbaseurl) et ignorée.
    command:
      - -Dsonar.core.serverBaseURL=${SONARQUBE_EXTERNAL_URL:-http://${SONARQUBE_HOSTNAME:-sonarqube.localhost}}
    # Aucun port publié : servi par Traefik (compose/proxy.yml) sur SONARQUBE_HOSTNAME
    labels:
      traefik.enable: "true"
      traefik.http.routers.sonarqube.rule: Host(`${SONARQUBE_HOSTNAME:-sonarqube.localhost}`)
      traefik.http.services.sonarqube.loadbalancer.server.port: "9000"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    networks:
      - platform

# Définition strictement identique dans chaque module (compose refuse les définitions divergentes)
networks:
  platform:
    name: ${PLATFORM_NETWORK:-devops-platform}
    driver: bridge

# Noms explicites (= noms qu'attribuait Compose : données existantes conservées). Le préfixe reprend
# le nom de projet : le changer impose de modifier aussi `name:` dans compose.yml, le filtre de
# config/promtail/promtail-config.yaml, le nom du fichier compose/projet-autorise/<projet>.env et
# la contrainte du provider Docker de compose/proxy.yml.
volumes:
  sonarqube_db:
    name: devops-platform_sonarqube_db
  sonarqube_data:
    name: devops-platform_sonarqube_data
  sonarqube_extensions:
    name: devops-platform_sonarqube_extensions
  sonarqube_logs:
    name: devops-platform_sonarqube_logs
