# =============================================================================
# Brique SonarQube : analyse statique
# Inclus par compose.yml ; ne se lance pas seul (voir l'en-tête de compose.yml).
# =============================================================================
services:

  # ---------------------------------------------------------------------------
  # SonarQube DB — PostgreSQL 15
  # ---------------------------------------------------------------------------
  sonarqube-db:
    image: postgres:15.19
    container_name: sonarqube-db
    restart: always
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONARQUBE_DB_PASSWORD}
      POSTGRES_DB: sonar
    volumes:
      - sonarqube_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - factory-network

  # ---------------------------------------------------------------------------
  # SonarQube Community Edition + plugin community branch
  # Prérequis hôte : sysctl -w vm.max_map_count=524288 (Elasticsearch intégré)
  # ---------------------------------------------------------------------------
  sonarqube:
    image: mc1arke/sonarqube-with-community-branch-plugin:26.5.0.122743-community
    container_name: sonarqube
    restart: always
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONARQUBE_DB_PASSWORD}
    ports:
      - "9000:9000"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    networks:
      - factory-network

# Définition strictement identique dans chaque module (compose refuse les définitions divergentes)
networks:
  factory-network:
    name: factory-network
    driver: bridge

volumes:
  sonarqube_db:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
