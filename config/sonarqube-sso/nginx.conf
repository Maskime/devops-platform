# Relais SSO de SonarQube (service sonarqube-sso, compose/sonarqube.yml) : entre Traefik (routeur protégé
# sonarqube, après la passerelle d'authentification) et SonarQube. Réécrit l'en-tête des groupes et
# refuse les logins des comptes locaux (sso.js). Mécanisme et limites : docs/sso.md, « SonarQube ».
# Le scanner, les appels API par jeton, le routeur interne des jobs et le serveur MCP joignent SonarQube
# sans passer par ce relais.

load_module modules/ngx_http_js_module.so;

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

# Groupe GitLab des administrateurs, lu par sso.js (process.env)
env SSO_GROUPE_ADMIN;

events {
    worker_connections 1024;
}

http {
    # Accès journalisés par Traefik
    access_log off;
    server_tokens off;
    default_type text/plain;
    charset utf-8;

    js_path /etc/devops-platform/sonarqube-sso;
    js_import sso.js;
    js_set $sso_groupes sso.groupes;
    js_set $sso_refus sso.refus;

    # DNS de Docker, réponses gardées 10 s : SonarQube recréé (nouvelle IP) est retrouvé sans
    # redémarrer le relais
    resolver 127.0.0.11 valid=10s ipv6=off;

    # En-tête des groupes : un chemin complet par groupe GitLab de l'utilisateur
    large_client_header_buffers 4 32k;
    client_max_body_size 64m;

    server {
        listen 8080;

        location / {
            set $amont http://sonarqube:9000;
            if ($sso_refus) {
                return 403 "Connexion refusée : identité absente, ou login réservé à un compte local de SonarQube (docs/sso.md).\n";
            }
            # URI de la requête transmise telle quelle ; X-Forwarded-* de Traefik transmis sans changement
            proxy_pass $amont;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Auth-Request-Groups $sso_groupes;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }

    # Sonde de santé (healthcheck), port non routé par Traefik
    server {
        listen 127.0.0.1:8081;

        location = /sante {
            return 200 "OK\n";
        }
    }
}
